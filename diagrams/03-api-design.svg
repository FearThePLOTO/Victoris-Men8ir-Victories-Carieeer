<rect x="40.0" y="1323.0" width="1120.0" height="50.0" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2" opacity="1.0"/>
<text x="52.0" y="1347.0" font-size="14" fill="#111111" font-family="'JetBrains Mono', monospace" text-anchor="start"><tspan x="52.0" dy="0.0">PUT /notifications/mark-read | notification-id -&gt; EMPTY | 200</tspan></text>
</g></svg>