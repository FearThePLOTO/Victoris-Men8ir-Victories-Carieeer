<text x="54.0" y="51.0" font-size="20" fill="#ffffff" font-family="'JetBrains Mono', monospace" text-anchor="start"><tspan x="54.0" dy="0.0">API design - token auth, EMPTY means reload list</tspan></text>
<rect x="40.0" y="85.0" width="1120.0" height="46.0" rx="8" fill="#14365d" stroke="#14365d" stroke-width="2" opacity="1.0"/>
