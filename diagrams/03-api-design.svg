<rect x="40.0" y="1025.0" width="1120.0" height="50.0" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2" opacity="1.0"/>
<text x="52.0" y="1049.0" font-size="14" fill="#111111" font-family="'JetBrains Mono', monospace" text-anchor="start"><tspan x="52.0" dy="0.0">PATCH /jobs/status/{app-id} | status -&gt; EMPTY | 204</tspan></text>
<rect x="40.0" y="1083.0" width="1120.0" height="50.0" rx="8" fill="#ffffff" stroke="#111111" stroke-width="2" opacity="1.0"/>
<text x="52.0" y="1107.0" font-size="14" fill="#111111" font-family="'JetBrains Mono', monospace" text-anchor="start"><tspan x="52.0" dy="0.0">GET /jobs/skill-gap/{job-id} | token, job -&gt; skill-list | 200</tspan></text>
<rect x="40.0" y="1153.0" width="1120.0" height="46.0" rx="8" fill="#14365d" stroke="#14365d" stroke-width="2" opacity="1.0"/>
<text x="54.0" y="1181.0" font-size="17" fill="#ffffff" font-family="'JetBrains Mono', monospace" text-anchor="start"><tspan x="54.0" dy="0.0">Notifications (3)</tspan></text>
